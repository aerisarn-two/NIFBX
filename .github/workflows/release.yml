#
# Builds NIFBX, runs the tests, and publishes it as a NuGet package on
# GitHub Packages plus a GitHub release carrying the assemblies.
#
# Tagging is the trigger, and tests gate the release: nothing is packed or pushed
# until the suite has passed on both platforms, in this same workflow and off this
# same commit.
#
# Tests run on Windows as well as Linux because of MOPP. Rebuilding mesh collision
# means building a MOPP tree, which only Havok's own code can do -- mopper.exe, a
# 32-bit Windows binary that the Mopper.Native package supplies. A Linux runner has
# no Wine to put it through, so the collision round trip is skipped there; Windows
# runs it directly through WOW64, and those tests actually execute.
#
# Use workflow_dispatch to build, test and pack without publishing anything.
#
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  #
  # Linux proves the library builds and runs where it is developed. Windows is
  # what makes the collision round trip testable at all: it is the only runner
  # that can execute mopper.exe.
  #
  # fail-fast is off so a platform-specific failure is not hidden by the other
  # platform failing first -- knowing it broke on one and not the other is most
  # of the diagnosis.
  #
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      #
      # The two corpus suites need an installed copy of the game to read BSAs
      # from and skip on both platforms. On Linux the collision round trip skips
      # too; on Windows it runs, and a difference in the skip count between the
      # two jobs is the collision path being exercised.
      #
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write   # to create the release
      packages: write   # to publish to GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"

            # Reject a malformed tag here rather than after a full build, which
            # is where dotnet pack would otherwise notice.
            semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "$version" =~ $semver ]]; then
              echo "tag '${GITHUB_REF#refs/tags/}' is not a version." \
                   "Expected vMAJOR.MINOR.PATCH, optionally with a prerelease" \
                   "suffix, e.g. v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi

            publish=true
          else
            # Not a release: still pack, so packaging breakage shows up here
            # rather than on the tag, but do not push it anywhere.
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            publish=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish"

      # NIFSharp, LeanMeshIO and Mopper.Native come from GitHub Packages, and
      # nuget.config takes the credentials from the environment.
      - name: Restore
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore

      - name: Build
        run: >
          dotnet build --no-restore -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:RepositoryUrl=https://github.com/${{ github.repository }}

      - name: Pack
        run: >
          dotnet pack src/NIFBX/NIFBX.csproj --no-build -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:RepositoryUrl=https://github.com/${{ github.repository }}
          -o artifacts

      # Fail here rather than at the release step, where an empty upload would
      # be reported as an unmatched glob and take longer to read.
      - name: Check the artifacts
        run: |
          set -euo pipefail
          ls -l src/NIFBX/bin/Release/net9.0/NIFBX.dll
          ls -l artifacts/*.nupkg
          test "$(ls artifacts/*.nupkg | wc -l)" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: NIFBX-${{ steps.version.outputs.version }}
          path: |
            src/NIFBX/bin/Release/net9.0/NIFBX.dll
            artifacts/*.nupkg
          if-no-files-found: error

      #
      # GITHUB_TOKEN is enough for GitHub Packages, so there is no secret to
      # configure. Consumers need a nuget.config pointing at this feed and a PAT
      # with read:packages -- see README.md.
      #
      - name: Publish to GitHub Packages
        if: steps.version.outputs.publish == 'true'
        run: >
          dotnet nuget push artifacts/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      #
      # Created after the package push, so a failed push never leaves a release
      # advertising a version that is not on the feed. Carries the same
      # assemblies the tests ran against and the same .nupkg that was published.
      #
      - name: Create the GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: NIFBX ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            src/NIFBX/bin/Release/net9.0/NIFBX.dll
            artifacts/*.nupkg
